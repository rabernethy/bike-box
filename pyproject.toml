[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framewright"
version = "0.1.0"
description = "Open-source parametric bicycle frame design (geometry, fit, drawings, miter templates)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "FrameWright contributors" }]
dependencies = ["PyQt6>=6.4", "numpy>=1.24"]

[project.optional-dependencies]
gif = ["Pillow>=9"]
pyside = ["PySide6>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
framewright = "framewright.__main__:main"

[tool.setuptools.packages.find]
include = ["framewright*"]

[tool.setuptools.package-data]
framewright = ["data/templates/*.fwd", "data/libraries/*.json", "data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
