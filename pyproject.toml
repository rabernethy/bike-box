[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bikebox"
version = "0.1.14"
description = "Open-source parametric bicycle frame design (geometry, fit, drawings, miter templates)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Bike Box contributors" }]
dependencies = ["PyQt6>=6.4", "numpy>=1.24", "defusedxml>=0.7", "pyqtgraph>=0.13", "PyOpenGL>=3.1"]

[project.optional-dependencies]
gif = ["Pillow>=9"]
pyside = ["PySide6>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
bikebox = "bikebox.__main__:main"

[tool.setuptools.packages.find]
include = ["bikebox*"]

[tool.setuptools.package-data]
bikebox = ["data/templates/*.bikebox", "data/libraries/*.json", "data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
